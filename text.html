<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textarea</title>
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

</head>
<body>
    <main>
        <article
        id = "editor"
        contenteditable = "plaintext-only"
        spellcheck = "true"
        aria-label = "Text editor"
        >
        </article>
    </main>

    <button
        type = "button"
        id = "menu-button"
        class = "no-print"
        aria-label = "Open Menu"
        aria-controls = "menu"
        aria-expanded = "false"
    >

        <svg
            width = "24"
            height = "24"
            viewBox = "0 0 24 24"
            fill = "none"
            stroke = "currentColor"
            stroke-width = "2"
            stroke-linecap = "round"
            stroke-linejoin = "round"
           aria-hidden = "true"
        >
            <line x1 = "3" y1 = "12" x2 = "21" y2 = "12"></line>
            <line x1 = "3" y1 = "6" x2 = "21" y2 = "6"></line>
            <line x1 = "3" y1 = "18" x2 = "21" y2 = "18"></line> 
    </svg>
    </button>

    <div id="menu" class="no-print" role="menu" aria-label="Editor actions">
        <a class="item" href="/text#new" role="menuitem"
        >
            New
        </a>
        <a class="item" id="share-link" href="#" role="menuitem">
            Share link
        </a>

        <a class="item" id="save-as-text" href="#" role="menuitem">
            Save as txt
        </a>
    </div>
    <div id="notification" class="no-print" role="status" aria-live="polite">
    </div>
</body>
</html>
