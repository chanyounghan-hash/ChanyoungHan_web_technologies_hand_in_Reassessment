<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textarea</title>
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#000000">

</head>
<body class="text-page">
     <header class="noprint">
        <nav>
            <ul>
                <li><a href="/text">Text editor</a></li>
                <li><a href="/">Todo</a></li>
                <li><a href="/complete">Completed</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
    </header>
    
    
    <div class="text-workspace">
    <aside class="task-panel noprint" aria-labelledby="todo-heading">
        <h2 id="todo-heading" class="title">To Do List</h2>
        <form id="todo-form">
            <label for="todo-input">New todo title</label>
            <input type="text" id="todo-input" placeholder="What do you plan To Do?" maxlength="200" aria-describedby="error-message">
            <button type="submit" id="submit-btn">Add</button>
        </form>
        <p id="error-message" class="error-message" role="alert"></p>
        <ul id="todo-list"></ul>
    </aside>
    <div class="editor-frame">
    <div id="line-numbers" class="noprint" aria-hidden="true">1</div>
    <article
        contenteditable="plaintext-only"
        spellcheck="true"
        autofocus
        aria-label="Markdown text editor"
    ></article>
    </div>
    <aside class="task-panel noprint" aria-labelledby="completed-heading">
        <h2 id="completed-heading" class="title">Completed Tasks</h2>
        <p id="complete-error" class="error-message" role="alert"></p>
        <p id="done-empty" hidden>There are no completed tasks yet.</p>
        <ul id="done-list" data-live="true"></ul>
    </aside>
    </div>
    <template id="todo-template" class="noprint">
        <li class="todo-item">
            <label class="item-label">
                <input type="checkbox" class="item-checkbox">
                <span class="item-title"></span>
            </label>
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
        </li>
    </template>
    

    <button
        type = "button"
        id = "button"
        class = "noprint"
        aria-label = "Open Menu"
        aria-controls = "menu"
        aria-expanded = "false"
    >

        <svg
            width = "24"
            height = "24"
            viewBox = "0 0 24 24"
            fill = "none"
            stroke = "currentColor"
            stroke-width = "2"
            stroke-linecap = "round"
            stroke-linejoin = "round"
           aria-hidden = "true"
        >
            <line x1 = "3" y1 = "12" x2 = "21" y2 = "12"></line>
            <line x1 = "3" y1 = "6" x2 = "21" y2 = "6"></line>
            <line x1 = "3" y1 = "18" x2 = "21" y2 = "18"></line> 
    </svg>
    </button>

    <div id="menu" class="noprint" role="menu" aria-label="Editor actions">
        <a class="item" href="/text#new" role="menuitem">
            <svg
                aria-hidden="true"
                focusable="false"
                width="22"
                height="22"
            >
                <use href="#icon-plus"></use>
            </svg>
            New
        </a>

        <a class="item" id="share-link" href="#" role="menuitem">
            <svg
                aria-hidden="true"
                focusable="false"
                width="22"
                height="22"
            >
                <use href="#icon-share"></use>
            </svg>
            Share link
        </a>

        <a class="item" id="save-as-text" href="#" role="menuitem">
            <svg
                aria-hidden="true"
                focusable="false"
                width="22"
                height="22"
            >
                <use href="#icon-save"></use>
            </svg>
            Save as txt
        </a>
    </div>

<div
    id="notification"
    class="noprint"
    role="status"
    aria-live="polite"
></div>
<svg class="icon-definitions" aria-hidden="true" focusable="false">
    <symbol
        id="icon-plus"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path d="M12 5v14M5 12h14"></path>
    </symbol>

    <symbol
        id="icon-share"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path
            d="M8 9H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1M12 14V3m-3 3 3-3 3 3"
        ></path>
    </symbol>

    <symbol
        id="icon-save"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path
            d="M6 4h10l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3 0v5h6V4m-3 13a2 2 0 1 0 0 .01"
        ></path>
    </symbol>
</svg>
<script src="/js/text.js" defer></script>
<script src="/js/index.js" defer></script>
<script src="/js/complete.js" defer></script>
</body>
</html>
